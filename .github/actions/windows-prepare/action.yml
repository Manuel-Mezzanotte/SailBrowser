name: Prepare the Windows build environment
description: Set up Python, the Windows SDK, the build folder D:\sail and the stage action
runs:
  using: composite
  steps:
    - name: Record job start
      shell: pwsh
      run: '"HELIUM_JOB_STARTED_AT=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Windows SDK 10.0.28000.0
      shell: pwsh
      run: |
        if (Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.28000.0\um\Windows.h") { exit 0 }
        Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2370315' -OutFile "$env:RUNNER_TEMP\winsdksetup.exe"
        $installer = Start-Process "$env:RUNNER_TEMP\winsdksetup.exe" -ArgumentList '/quiet', '/norestart', '/features', '+' -Wait -PassThru
        if ($installer.ExitCode -notin @(0, 3010)) { throw "Windows SDK installation failed: $($installer.ExitCode)" }
    # C: has only about 30 GB free on GitHub's Windows runners, D: about 150 GB.
    # Chromium needs far more than 30 GB, so everything goes on D:, temporary
    # files included.
    - name: Copy the repository to D:\sail
      shell: pwsh
      run: |
        Copy-Item -Path . -Destination "D:\sail" -Recurse
        New-Item -ItemType Directory -Force -Path "D:\tmp" | Out-Null
        "SAIL_REPO=D:\sail" >> $env:GITHUB_ENV
        "TEMP=D:\tmp" >> $env:GITHUB_ENV
        "TMP=D:\tmp" >> $env:GITHUB_ENV
        Get-PSDrive C, D | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
    - name: Install Python packages
      shell: pwsh
      run: python -m pip install requests Pillow
    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Set up the stage action
      shell: pwsh
      run: npm ci
      working-directory: ./.github/actions/windows-stage
